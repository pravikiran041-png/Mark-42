name: Build JARVIS Executables

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]
    
    runs-on: ${{ matrix.os }}

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt pynput websockets ngrok pyinstaller
        
    - name: Install Windows specific dependencies
      if: matrix.os == 'windows-latest'
      run: pip install pywinauto pywin32 comtypes pycaw win10toast

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller --onefile --name JARVIS --icon=NONE jarvis_daemon.py
        
    - name: Upload Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: JARVIS-${{ matrix.os }}
        path: dist/JARVIS*
